<span class="material-symbols-outlined text-[16px]">photo_camera</span>

</button>

<!-- Hero Header Block -->
<div class="px-page-padding-mobile pt-2 pb-3 text-center">
<h2 class="font-headline-md text-headline-md text-wine-burgundy font-normal tracking-tight">Find a wine.</h2>
<p class="font-body-sm text-body-sm text-muted-ink mt-0.5 max-w-[280px] mx-auto">
      Scan a code, use a label photo, or search by name.
    </p>

<!-- Viewfinder Area -->
<div class="px-page-padding-mobile flex-1 flex flex-col items-center justify-center">
<div class="w-full max-w-sm aspect-[4/3] bg-warm-white rounded-xl relative overflow-hidden shadow-sm flex flex-col items-center justify-between p-4">
<!-- Reference Graphic subtle backdrop -->
<div class="absolute inset-0 opacity-15 pointer-events-none bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCqiEOLSq_ldX6-y4bI-3zAlsQVrMqhdJzun0DmfHO3KA0VJDzQdWuOW_QuZf9UgISnCtYGrBFzYeTHYXWT9vgSQLGKwRejh870b-Q4oRe8bJ50Rsdshi6JPm8NnKhn17gW54AEYlnZzCHSkoyXHchQ6Vwgo7c85Cn7cbPBczVU1XfT41vOsJP38eCXJ3Knf7NTQqUmg17OIN9rXCGCwHbV0WPBhM6y0YnMK7EWCGJKBQXdaQwnMD4OubKTK3UrZmK9bQg');"></div>

<!-- Simulated Barcode Lines & Scan Ray -->

<div class="w-1 h-16 bg-warm-ink rounded-full"></div>

</div>

<span class="material-symbols-outlined text-wine-burgundy text-[20px]">edit_note</span>
<span>Add wine manually</span>
</button>
</div>

<!-- Interactive Feedback Toast -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-warm-ink text-warm-white px-4 py-2 rounded-full font-label text-label opacity-0 pointer-events-none transition-opacity duration-300 shadow-md flex items-center gap-2 z-50" id="status-toast">
<span class="material-symbols-outlined text-secondary-fixed text-[18px]" id="toast-icon">check_circle</span>
<span id="toast-message">Scanning sample vintage...</span>
</div>
</div>
<script>
  (function() {
    const sampleBtn = document.getElementById('sample-barcode-btn');
    const noMatchBtn = document.getElementById('no-match-link');
    const torchBtn = document.getElementById('torch-toggle');
    const toast = document.getElementById('status-toast');
    const toastMsg = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');

    let toastTimer = null;
    function showToast(msg, icon) {
      if (toastTimer) clearTimeout(toastTimer);
      toastMsg.textContent = msg;
      toastIcon.textContent = icon || 'check_circle';
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2600);
    }

    if (sampleBtn) {
      sampleBtn.addEventListener('click', () => {
        showToast('Sample detected: 2018 Domaine Dujac Morey-Saint-Denis', 'wine_bar');
      });
    }

    if (noMatchBtn) {
      noMatchBtn.addEventListener('click', (e) => {
        e.preventDefault();
        showToast('Barcode not recognized. Try manual entry.', 'help_outline');
      });
    }

    if (torchBtn) {
      let active = false;
      torchBtn.addEventListener('click', () => {
        active = !active;
        torchBtn.classList.toggle('text-wine-burgundy', active);
        torchBtn.classList.toggle('bg-burgundy-wash', active);
        showToast(active ? 'Camera light enabled' : 'Camera light turned off', active ? 'flashlight_on' : 'flashlight_off');
      });
    }
  })();
